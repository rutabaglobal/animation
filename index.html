<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leopard Animation</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Container */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
}

/* Text */
.text {
  font-size: 60px;
  font-weight: bold;
  display: flex;
  gap: 10px;
}

/* Animation */
.word {
  opacity: 0;
  transform: translateY(40px);
  animation: fadeUp 1s forwards;
}

.word:nth-child(1) { animation-delay: 0.2s; }
.word:nth-child(2) { animation-delay: 0.6s; }
.word:nth-child(3) { animation-delay: 1s; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.yellow {
  color: #f4b400;
}
</style>
</head>

<body>

<div class="hero">
  <div class="text">
    <span class="word">Leopard</span>
    <span class="word">•</span>
    <span class="word yellow">Lead</span>
  </div>
</div>

</body>
</html>
